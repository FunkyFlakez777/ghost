<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Y-Chat Demo</title>
<style>
:root{--bg:#05070a;--panel:#0b0f14;--line:#223042;--soft:#111823;--text:#eef4ff;--muted:#8d9bad;--blue:#8fb7ff;--green:#46e6a4;--gold:#e7bb61;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#172131 0,#080b10 35%,#030405 72%);color:var(--text)}button,input{font:inherit}.app{max-width:460px;margin:0 auto;min-height:100vh;padding:14px}.shell{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(14,19,27,.96),rgba(5,8,12,.98));border:1px solid #314053;border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.55);min-height:calc(100vh - 28px)}
.header{height:74px;padding:16px 18px;border-bottom:1px solid #18222d;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;letter-spacing:.15em}.tag{font-size:10px;color:#8da0b7;letter-spacing:.18em;margin-top:3px}.right{display:flex;align-items:center;gap:8px}.coin{padding:7px 10px;border:1px solid #5a4b2b;border-radius:999px;color:#f6d98a;font-size:12px;background:#17130b}.ghostBtn{background:#101722;border:1px solid #5d7190;color:#dbe8ff;border-radius:9px;padding:7px 10px;letter-spacing:.12em;font-size:11px;cursor:pointer}
.track{display:flex;width:200%;transition:transform .42s cubic-bezier(.2,.8,.2,1)}.track.show-yokai{transform:translateX(-50%)}.page{width:50%;padding:14px 16px 18px}.card{background:#0a0f15;border:1px solid #1d2a38;border-radius:18px;padding:14px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}input{width:100%;background:#080c11;color:#fff;border:1px solid #2c3949;border-radius:11px;padding:12px 13px;outline:none}input:focus{border-color:#6d8fd0}.btn{border:none;border-radius:11px;padding:11px 13px;background:#637fe2;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#172131}.status{font-size:12px;color:var(--muted);margin:8px 2px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#68707b;margin-right:6px}.dot.on{background:var(--green);box-shadow:0 0 14px rgba(70,230,164,.65)}.sp{height:12px}.chat{margin-top:14px;display:none}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;color:#a9b5c4}.peer{font-weight:700;color:#fff}.messages{height:48vh;min-height:320px;overflow:auto;padding:12px 7px;background:#05080c;border:1px solid #17212d;border-radius:16px}.msg{max-width:78%;padding:10px 11px;border-radius:13px;margin:9px 0;word-break:break-word;border:1px solid transparent}.me{margin-left:auto;background:#141c27;border-color:#26364a}.them{background:#0c1219;border-color:#1b2836}.meta{font-size:10px;color:#728094;margin-top:5px}.composer{display:flex;gap:8px;margin-top:9px}.note{font-size:10px;color:#657386;margin-top:10px;text-align:center}
.yWrap{text-align:center;padding:4px 4px 18px}.yTitle{letter-spacing:.22em;font-size:18px;margin:8px 0 4px}.lvl{color:#aab7c7;font-size:12px}.xpbar{height:8px;background:#16202b;border-radius:99px;overflow:hidden;margin:15px auto 6px;max-width:270px}.xpfill{height:100%;width:0;background:linear-gradient(90deg,#d6e6ff,#7aa7ff);box-shadow:0 0 14px #7aa7ff;transition:width .4s}.xptext{font-size:11px;color:#72839a}.scene{height:330px;margin:16px 0;border-radius:18px;border:1px solid #203044;background:radial-gradient(circle at 50% 65%,rgba(70,102,145,.22),transparent 30%),linear-gradient(#081018,#030507);position:relative;overflow:hidden}.moon{position:absolute;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dae9ff,#7b8ca8 50%,#344054 70%);opacity:.23;right:28px;top:24px;filter:blur(.2px)}.torii{position:absolute;left:24px;bottom:25px;width:88px;height:95px;opacity:.18}.torii:before,.torii:after{content:"";position:absolute;background:#9fb3ca}.torii:before{left:18px;top:25px;width:8px;height:70px;box-shadow:45px 0 #9fb3ca}.torii:after{left:3px;top:18px;width:75px;height:7px;box-shadow:9px -11px #9fb3ca}
.creature{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);width:138px;height:154px;animation:float 3.2s ease-in-out infinite}.body{position:absolute;left:17px;bottom:7px;width:104px;height:112px;background:radial-gradient(circle at 42% 30%,#203347,#0a0e15 63%,#020304);border-radius:55% 48% 46% 52%;box-shadow:0 0 22px rgba(116,157,214,.32),inset 0 0 25px rgba(115,160,220,.15);border:1px solid #5c7390}.flame{position:absolute;left:53px;top:2px;width:45px;height:66px;background:linear-gradient(145deg,#345d86,#0d1725 62%,#040608);border:1px solid #6b85a3;border-radius:70% 0 70% 70%;transform:rotate(37deg);box-shadow:0 0 20px rgba(81,130,194,.4)}.eye{position:absolute;top:48px;width:18px;height:28px;border-radius:50%;background:#eaf6ff;box-shadow:0 0 14px #d9efff}.eye.l{left:27px}.eye.r{right:27px}.mouth{position:absolute;left:45px;top:80px;width:16px;height:8px;border-bottom:2px solid #dcecff;border-radius:0 0 50% 50%}.shadow{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:165px;height:25px;border:1px solid #6f93c4;border-radius:50%;box-shadow:0 0 24px rgba(89,135,196,.4)}@keyframes float{50%{transform:translate(-50%,-55%)}}
.mood{font-size:13px;color:#9fb6d4}.mood b{color:#8db0ff;letter-spacing:.12em}.quote{color:#72839a;font-size:12px;margin-top:8px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#091018;border:1px solid #1c2a39;border-radius:12px;padding:10px 6px}.stat strong{display:block;font-size:15px}.stat span{font-size:9px;color:#718195;text-transform:uppercase;letter-spacing:.1em}.footbtn{margin-top:14px;background:none;border:1px solid #34485f;color:#a9bdd5;border-radius:10px;padding:9px 13px;cursor:pointer}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111a24;border:1px solid #38506b;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
@media(max-width:520px){.app{padding:0}.shell{min-height:100vh;border-radius:0;border-left:0;border-right:0}.messages{height:45vh}.scene{height:300px}}
</style>
</head>
<body>
<div class="app"><div class="shell">
<div class="header"><div><div class="brand">Y-CHAT</div><div class="tag">CHAT. EVOLVE. DISAPPEAR.</div></div><div class="right"><div class="coin">◉ <span id="coinTop">0</span> YC</div><button class="ghostBtn" id="toggle">YŌKAI</button></div></div>
<div class="track" id="track">
<section class="page"><div class="card">
<div class="row"><input id="myId" class="grow" placeholder="Deine Y-ID"/><button id="register" class="btn">Online</button></div><div id="meStatus" class="status"><span class="dot"></span>Offline</div><div class="sp"></div>
<div class="row"><input id="peerId" class="grow" placeholder="Y-ID deines Kontakts"/><button id="check" class="btn secondary">Prüfen</button></div><div id="peerStatus" class="status"><span class="dot"></span>Kontakt nicht geprüft</div>
<div id="chat" class="chat"><div class="topbar"><div>Chat mit <span id="peerLabel" class="peer"></span></div><div>60s nach Lesen</div></div><div id="messages" class="messages"></div><div class="composer"><input id="text" class="grow" placeholder="Nur live zustellbar …" maxlength="2000"/><button id="send" class="btn">➤</button></div></div>
<div class="note">DEMO · nur Live-Zustellung · noch keine echte Ende-zu-Ende-Verschlüsselung</div></div></section>
<section class="page"><div class="yWrap"><div class="yTitle">YŌKAI // KAGE</div><div class="lvl">Level <span id="level">1</span></div><div class="xpbar"><div class="xpfill" id="xpfill"></div></div><div class="xptext"><span id="xp">0</span>/<span id="xpNeed">20</span> XP</div>
<div class="scene"><div class="moon"></div><div class="torii"></div><div class="shadow"></div><div class="creature"><div class="flame"></div><div class="body"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div></div></div>
<div class="mood">Mood: <b id="mood">RESTLESS</b></div><div class="quote" id="quote">„Ich höre zu. Noch ist es still.“</div><div class="stats"><div class="stat"><strong id="coinStat">0</strong><span>Y-Coins</span></div><div class="stat"><strong id="msgStat">0</strong><span>Messages</span></div><div class="stat"><strong id="streakStat">1</strong><span>Streak</span></div></div><button class="footbtn" id="back">← zurück zum Chat</button></div></section>
</div></div></div><div class="toast" id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io({reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:500,timeout:10000});
const $=id=>document.getElementById(id);let me=localStorage.getItem('ychat.id')||'',peer='',registered=false;const timers=new Map();
let game=JSON.parse(localStorage.getItem('ychat.game')||'{"xp":0,"coins":0,"messages":0,"lastDay":""}');
function saveGame(){localStorage.setItem('ychat.game',JSON.stringify(game));renderGame()}
function renderGame(){const lvl=Math.floor(game.xp/20)+1,into=game.xp%20;$('level').textContent=lvl;$('xp').textContent=into;$('xpNeed').textContent=20;$('xpfill').style.width=(into/20*100)+'%';$('coinTop').textContent=$('coinStat').textContent=game.coins;$('msgStat').textContent=game.messages;const m=game.messages>20?'HYPED':game.messages>8?'CALM':'RESTLESS';$('mood').textContent=m;$('quote').textContent=m==='HYPED'?'„Du warst heute lange da. Das gefällt mir.“':m==='CALM'?'„Alles im Flow.“':'„Ich höre zu. Noch ist es still.“'}
function reward(){game.messages++;game.xp+=2;if(game.messages%5===0){game.coins+=2;toast('+2 YC · Kage reagiert auf euren Chat')}saveGame()}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function setPresence(el,text,on){el.innerHTML=`<span class="dot ${on?'on':''}"></span>${text}`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function safeSelector(id){return String(id).replace(/[^a-zA-Z0-9_-]/g,'_')}
function registerNow(){if(!me||!socket.connected)return;setPresence($('meStatus'),'Verbinde …',false);socket.timeout(5000).emit('register',{id:me},(err,res)=>{if(err||!res?.ok){registered=false;setPresence($('meStatus'),'Verbindung fehlgeschlagen',false);$('register').disabled=false;return}registered=true;localStorage.setItem('ychat.id',me);$('myId').disabled=true;$('register').disabled=true;setPresence($('meStatus'),`Online als ${escapeHtml(me)}`,true);if(peer)checkPeer()})}
socket.on('connect',()=>{if(me){$('myId').value=me;registerNow()}});socket.on('disconnect',()=>{registered=false;setPresence($('meStatus'),me?'Kurz weg … verbinde neu':'Offline',false);$('send').disabled=true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me){if(!socket.connected)socket.connect();else registerNow()}});window.addEventListener('focus',()=>{if(me&&socket.connected)registerNow()});
$('myId').value=me;$('register').onclick=()=>{me=$('myId').value.trim();if(!me)return;registerNow()};
function checkPeer(){peer=$('peerId').value.trim();if(!peer)return;if(!registered){setPresence($('peerStatus'),'Erst selbst online gehen',false);return}$('check').disabled=true;socket.timeout(5000).emit('presence:check',{id:peer},(err,res)=>{$('check').disabled=false;if(err||!res){setPresence($('peerStatus'),'Prüfung fehlgeschlagen',false);return}const on=!!res.online;setPresence($('peerStatus'),on?`${escapeHtml(peer)} ist online`:`${escapeHtml(peer)} ist offline`,on);$('peerLabel').textContent=peer;$('chat').style.display=on?'block':'none';$('send').disabled=!on})}$('check').onclick=checkPeer;
socket.on('presence:update',({id,online})=>{if(peer&&id===peer){setPresence($('peerStatus'),online?`${escapeHtml(peer)} ist online`:`${escapeHtml(peer)} ist offline`,online);$('chat').style.display=online?'block':'none';$('send').disabled=!online||!registered}});
function addMessage({clientId,from,text},mine){const div=document.createElement('div');div.className=`msg ${mine?'me':'them'}`;div.dataset.id=safeSelector(clientId);div.innerHTML=`<div>${escapeHtml(text)}</div><div class="meta"><span>${mine?'gesendet':'gelesen'}</span> · <span class="timer">${mine?'wartet':'60s'}</span></div>`;$('messages').appendChild(div);$('messages').scrollTop=$('messages').scrollHeight;reward();if(!mine){const readAt=Date.now();socket.emit('message:read',{to:from,clientId,readAt});startTimer(clientId,readAt)}}
function startTimer(clientId,readAt){const el=document.querySelector(`[data-id="${safeSelector(clientId)}"]`);if(!el)return;const timerEl=el.querySelector('.timer');clearInterval(timers.get(clientId));const tick=()=>{const left=Math.max(0,60-Math.floor((Date.now()-readAt)/1000));timerEl.textContent=`${left}s`;if(left<=0){clearInterval(timers.get(clientId));timers.delete(clientId);el.style.opacity=.15;setTimeout(()=>el.remove(),300)}};tick();timers.set(clientId,setInterval(tick,250))}
function makeId(){return crypto?.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}
function send(){const text=$('text').value.trim();if(!text||!peer||!registered)return;socket.emit('message:send',{to:peer,text,clientId:makeId()});$('text').value=''}$('send').onclick=send;$('text').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
socket.on('message:sent',m=>addMessage(m,true));socket.on('message:incoming',m=>{if(!peer){peer=m.from;$('peerId').value=peer;$('peerLabel').textContent=peer;$('chat').style.display='block'}if(m.from===peer)addMessage(m,false)});socket.on('message:read',({clientId,readAt})=>startTimer(clientId,readAt));socket.on('message:error',()=>{setPresence($('peerStatus'),`${escapeHtml(peer)} ist offline`,false);$('chat').style.display='none'});
function showY(v){$('track').classList.toggle('show-yokai',v)}$('toggle').onclick=()=>showY(!$('track').classList.contains('show-yokai'));$('back').onclick=()=>showY(false);
let sx=0;$('track').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});$('track').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(dx<-60)showY(true);if(dx>60)showY(false)},{passive:true});
renderGame();
</script>
</body></html>
